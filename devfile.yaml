schemaVersion: 2.3.0

attributes:
    editorFree: true

metadata:
  name: cli-ai-opencode
  icon: https://raw.githubusercontent.com/Fredouye/devspaces/main/icon.svg
  displayName: CLI AI - OpenCode
  description: Environnement sandbox pour Claude Code / OpenCode
  version: 1.0.0
  tags:
    - ai
    - cli
    - opencode
  projectType: cli
  language: shell

variables:
  image_version: 1.0

# Stockage persistant à l'échelle de l'utilisateur (survit aux redémarrages du workspace)
attributes:
  controller.devfile.io/storage-type: per-user               # per-workspace

projects:
  - name: mon-projet
    git:
      remotes:
        origin: https://github.com/Fredouye/mon-projet.git
      # facultatif : brancher sur une révision précise
      checkoutFrom:
        revision: main
        remote: origin
    # facultatif : sous-dossier de destination dans le sourceMapping
    clonePath: mon-projet

components:
  - name: tools
    attributes:
      deployment/replicas: 1
    container:
      image: docker.io/fredouye/devspaces-opencode:{{image_version}}
      memoryRequest: 512Mi
      memoryLimit: 8Gi
      cpuRequest: '0.5'
      cpuLimit: '2'
      sourceMapping: /projects
      mountSources: true
      env:
        - name: OPENCODE_HOME
          value: /home/user/.opencode
        - name: SHELL
          value: /bin/bash
      volumeMounts:
        - name: opencode-data
          path: /home/user/.opencode
      # Endpoint exposé si un outil web tourne dans le container
      endpoints:
        - name: opencode-ui
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true

  # Volume persistant référencé ci-dessus
  - name: opencode-data
    volume:
      size: 2Gi

starterProjects:
  - name: web-starter
    description: A web service starting point.
    git:
      remotes:
        origin: https://github.com/devfile-samples/devfile-stack-go.git

commands:
  - id: git-pull
    exec:
      component: tools
      commandLine: git pull --ff-only || true
      workingDir: ${PROJECT_SOURCE}

events:
  postStart:
    - git-pull
